name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar la app web
        run: python3 tools/preparar_web.py
      - name: Compilar
        run: gradle :app:assembleRelease --stacktrace
      - name: Preparar APK
        run: cp app/build/outputs/apk/release/app-release.apk Wiskunde4.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Wiskunde4
          path: Wiskunde4.apk
      - name: Publicar versión
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Wiskunde4 1.${{ github.run_number }}
          body: |
            Descarga **Wiskunde4.apk** desde el móvil e instálala. Si ya tenías una versión, se actualiza y conservas tu progreso.
          files: Wiskunde4.apk
          make_latest: true
