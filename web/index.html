<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#FBF7F0">
<title>Wiskunde 4</title>
<style>
@font-face{font-family:Outfit;src:url(Outfit.ttf) format('truetype');font-weight:100 900;font-display:block}
:root{--bg:#FBF7F0;--card:#fff;--ink:#1d2433;--mute:#6b7383;--line:#e7e3da;--or:#e0701a;--or2:#f6a04d;--orl:#fff1e4;
--bl:#3b7be0;--bll:#eaf2ff;--gr:#2f9e63;--grl:#e6f6ed;--pu:#8a55d6;--pul:#f3ecff;--rd:#d64545;--rdl:#fdeaea}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:Outfit,system-ui,sans-serif;font-size:16px}
body{overscroll-behavior:none}
#app{max-width:520px;margin:0 auto;min-height:100%;padding:18px 18px 96px}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
i.nl,.nl{font-style:italic;color:#9a4a0b}
h1{font-size:26px;font-weight:700}
h2{font-size:21px;font-weight:700;line-height:1.2}
.mute{color:var(--mute);font-size:14px}
.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:0 1px 0 var(--line);margin-bottom:14px}
.btn{display:block;width:100%;background:var(--or);color:#fff;font-weight:700;font-size:17px;border-radius:16px;padding:15px;text-align:center}
.btn.dark{background:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn:disabled{opacity:.4}
.row{display:flex;gap:10px;align-items:center}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.x{width:38px;height:38px;border-radius:12px;background:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 0 var(--line)}
.pbar{flex:1;display:flex;gap:5px}.pbar span{flex:1;height:6px;border-radius:3px;background:var(--line)}.pbar .on{background:var(--or)}
/* home */
.hero{display:flex;gap:16px;align-items:center}
.ring{position:relative;width:118px;height:118px;flex:none}
.ring .pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .pct b{font-size:28px}.ring .pct small{font-size:11px;color:var(--mute)}
.stat b{font-size:20px}.stat{font-size:13px;color:var(--mute);margin-bottom:6px}
.map{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-top:14px}
.map div{aspect-ratio:1;border-radius:5px;background:var(--line)}
.legend{display:flex;gap:12px;font-size:11px;color:var(--mute);margin-top:8px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:-1px;background:var(--c)}
.today{background:var(--ink);color:#fff;border-radius:20px;padding:16px;margin-bottom:14px}
.today p{opacity:.8;font-size:14px;margin:4px 0 12px}
.block{border-radius:18px;padding:14px;margin-bottom:10px}
.bhead{display:flex;align-items:center;gap:12px}
.ico{width:42px;height:42px;border-radius:13px;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.bt{font-weight:700;font-size:17px}.bs{font-size:12px;color:var(--mute)}
.bprog{height:6px;background:rgba(0,0,0,.08);border-radius:3px;margin-top:7px}.bprog i{display:block;height:6px;border-radius:3px}
.lessons{margin-top:10px;display:none}.block.open .lessons{display:block}
.les{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:10px 12px;margin-top:6px;width:100%;text-align:left}
.les .dot{width:12px;height:12px;border-radius:50%;flex:none;background:var(--line)}
.les .lt{flex:1;font-size:15px}.les .lt small{display:block;color:var(--mute);font-size:12px}
.les.lock{opacity:.5}
.tag{font-size:11px;padding:3px 8px;border-radius:10px;background:var(--line);color:var(--mute)}
/* steps */
.q{font-size:20px;font-weight:700;line-height:1.25;margin-bottom:6px}
.txt{font-size:16px;line-height:1.45;margin-bottom:10px}
.more{background:#f6f3ee;border-radius:12px;padding:12px;font-size:15px;line-height:1.45;margin-top:8px}
.morebtn{font-size:13px;color:var(--or);font-weight:600;margin-top:6px}
.vis{margin:12px 0;display:flex;justify-content:center;flex-direction:column;align-items:center}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.opt{border:2px solid var(--line);background:#fff;border-radius:14px;padding:14px 8px;font-size:19px;font-weight:700;text-align:center}
.opt.ok{border-color:var(--gr);background:var(--grl);color:var(--gr)}
.opt.bad{border-color:var(--rd);background:var(--rdl);color:var(--rd)}
.fb{border-radius:14px;padding:12px 14px;margin:12px 0;font-size:15px;line-height:1.45}
.fb.ok{background:var(--grl);color:#1f6e44}.fb.bad{background:var(--rdl);color:#8f2b2b}
.fb b{display:block;margin-bottom:3px}
.numin{display:flex;gap:8px;margin:14px 0}
.numin input{flex:1;min-width:0;font:inherit;font-size:22px;font-weight:700;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--ink)}
.numin input:focus{outline:none;border-color:var(--or)}
.foot{position:fixed;left:0;right:0;bottom:0;padding:12px 18px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
.foot.navd{bottom:62px}
.foot>div{max-width:484px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
/* place table */
.pt{display:flex;gap:4px;width:100%}
.pt .col{flex:1;min-width:0;background:#fff;border-radius:12px;border:2px solid var(--line);text-align:center;padding:6px 1px}
.pt .h{font-weight:700;font-size:15px}.pt .v{font-size:10px;color:var(--mute)}
.pt .d{font-size:28px;font-weight:700;margin:4px 0}
.pt .pm{display:flex;flex-direction:column;align-items:center;gap:4px}
.pt .pm button{width:38px;height:32px;border-radius:9px;background:var(--orl);color:var(--or);font-weight:700;font-size:18px}
.pt .dots{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;min-height:24px;margin:2px 4px}
.pt .dots i{width:7px;height:7px;border-radius:2px;background:var(--c)}
.big{font-size:30px;font-weight:700;text-align:center;letter-spacing:.5px;margin:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;font-size:18px;font-weight:700}
.chips span.c{padding:6px 10px;border-radius:10px;color:#fff}
.ordr{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.ordr button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;font-size:18px;font-weight:700}
.ordr button.used{opacity:.3}
.slot{min-height:52px;border:2px dashed var(--line);border-radius:14px;display:flex;flex-wrap:wrap;gap:6px;padding:6px;align-items:center;justify-content:center;font-weight:700;font-size:17px}
.slot span{background:var(--orl);color:var(--or);border-radius:10px;padding:6px 10px}
input[type=range]{width:100%;accent-color:var(--or);height:30px}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
.nav button{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--mute);gap:2px;padding:2px 10px}
.nav button b{font-size:20px;font-weight:600;line-height:1}
.nav button.on{color:var(--or)}
/* tutor */
.chat{display:flex;flex-direction:column;gap:10px;padding-bottom:190px}
.msg{max-width:86%;padding:11px 14px;border-radius:18px;font-size:15px;line-height:1.45;white-space:pre-wrap}
.me{background:var(--ink);color:#fff;margin-left:auto;border-bottom-right-radius:5px}
.bot{background:#fff;border-bottom-left-radius:5px;box-shadow:0 1px 0 var(--line)}
.bot .nl,.bot em{color:#9a4a0b}
.ctx{font-size:12px;color:var(--mute);background:#fff;border-radius:12px;padding:8px 12px}
.tchips{display:flex;gap:6px;flex-wrap:wrap}
.tchips button{font-size:13px;border:1.5px solid var(--or);color:var(--or);border-radius:20px;padding:6px 11px;background:#fff}
.tin{display:flex;gap:8px}
.tin textarea{flex:1;font:inherit;font-size:15px;border-radius:18px;border:1.5px solid var(--line);padding:10px 14px;resize:none;height:46px;background:#fff;color:var(--ink)}
.tin button{width:46px;height:46px;border-radius:50%;background:var(--or);color:#fff;font-size:20px;flex:none}
/* glossary */
.term{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:11px 14px;margin-bottom:8px}
.term .w{flex:1}.term .w b{font-size:17px;color:#9a4a0b;font-style:italic;font-weight:600}.term .w small{display:block;color:var(--mute);font-size:14px}
.spk{width:38px;height:38px;border-radius:50%;background:var(--orl);color:var(--or);font-size:17px}
.field{width:100%;font:inherit;font-size:15px;padding:12px;border-radius:12px;border:1.5px solid var(--line);margin:8px 0;background:#fff;color:var(--ink)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;z-index:9;max-width:90%}
.done{text-align:center;padding-top:30px}
.done .bigpct{font-size:52px;font-weight:800;color:var(--or)}
svg text{font-family:Outfit,system-ui,sans-serif}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ============ utilidades ============ */
const $ = s => document.querySelector(s);
const NB = "\u00A0";
const fmt = n => { const [i, d] = String(n).split("."); return i.replace(/\B(?=(\d{3})+(?!\d))/g, NB) + (d ? "," + d : ""); };
const dec = n => String(+n.toFixed(3)).replace(".", ",");
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const addDays = (s, n) => { const d = new Date(s + "T12:00:00"); d.setDate(d.getDate() + n); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const parseNum = s => { s = String(s).replace(/[\s  .]/g, "").replace(",", "."); return s === "" ? NaN : Number(s); };
function toast(m) { const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2400); }
window.w4Toast = toast;
function speak(txt) {
  try { if (window.W4Native && W4Native.speak) { W4Native.speak(txt); return; } } catch (e) {}
  try { const u = new SpeechSynthesisUtterance(txt); u.lang = "nl-BE"; u.rate = .9; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) { toast("Pronunciación no disponible"); }
}

/* ============ estado ============ */
const KEY = "w4state";
let S;
function load() {
  try { S = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { S = {}; }
  S.les = S.les || {}; S.errors = S.errors || []; S.days = S.days || []; S.chat = S.chat || [];
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function markDay() { const t = today(); if (!S.days.includes(t)) { S.days.push(t); save(); } }
function getKey() { try { return localStorage.getItem("w4key") || ""; } catch (e) { return ""; } }
function setKey(k) { try { localStorage.setItem("w4key", k); } catch (e) {} }
load();

/* ============ visuales (SVG) ============ */
function barSVG(n, k, opts = {}) {
  const W = opts.w || 300, H = opts.h || 46, c = opts.color || "#f6a04d";
  let s = `<svg viewBox="-2 -2 ${W + 4} ${H + 4}" width="100%" style="max-width:${W + 4}px">`;
  for (let i = 0; i < n; i++) {
    const x = i * W / n;
    s += `<rect data-i="${i}" x="${x}" y="0" width="${W / n}" height="${H}" fill="${i < k ? c : "#fff"}" stroke="#1d2433" stroke-width="2"/>`;
  }
  return s + `<rect x="0" y="0" width="${W}" height="${H}" rx="6" fill="none" stroke="#1d2433" stroke-width="2.5"/></svg>`;
}
function lineSVG(min, max, ticks, opt = {}) {
  const W = 320, L = 26, R = 294, y = 44;
  const X = v => L + (v - min) / (max - min) * (R - L);
  let s = `<svg class="nl-line" viewBox="0 0 ${W} 90" width="100%" style="touch-action:none;max-width:420px">`;
  s += `<line x1="${L}" y1="${y}" x2="${R}" y2="${y}" stroke="#1d2433" stroke-width="3" stroke-linecap="round"/>`;
  for (let v = min; v <= max + 1e-9; v += ticks) {
    const big = Math.abs((v - min) % (ticks * (opt.labelEvery || 1))) < 1e-9 || v === max;
    s += `<line x1="${X(v)}" y1="${y - (big ? 9 : 5)}" x2="${X(v)}" y2="${y + (big ? 9 : 5)}" stroke="#1d2433" stroke-width="2"/>`;
    if (big && opt.labels !== false) s += `<text x="${X(v)}" y="${y + 26}" font-size="${opt.fs || 10}" text-anchor="middle" fill="#6b7383">${fmt(v)}</text>`;
  }
  if (opt.mark != null) s += `<path d="M${X(opt.mark)} ${y - 8} l-7 -14 h14 z" fill="#e0701a"/>`;
  if (opt.point != null) s += `<circle cx="${X(opt.point)}" cy="${y}" r="7" fill="#e0701a"/>` + (opt.pointLabel ? `<text x="${X(opt.point)}" y="${y - 14}" font-size="12" font-weight="700" text-anchor="middle" fill="#e0701a">${opt.pointLabel}</text>` : "");
  return s + `</svg>`;
}
function gridSVG(filled, opt = {}) {
  const c = 26; let s = `<svg viewBox="-2 -2 ${c * 10 + 4} ${c * 10 + 4}" width="100%" style="max-width:270px;touch-action:manipulation">`;
  for (let r = 0; r < 10; r++) for (let q = 0; q < 10; q++) {
    const i = r * 10 + q;
    s += `<rect data-i="${i}" data-r="${r}" x="${q * c}" y="${r * c}" width="${c}" height="${c}" fill="${filled.has ? (filled.has(i) ? "#f6a04d" : "#fff") : (i < filled ? "#f6a04d" : "#fff")}" stroke="#c9c3b8" stroke-width="1"/>`;
  }
  for (let r = 0; r <= 10; r++) s += `<line x1="0" y1="${r * c}" x2="${c * 10}" y2="${r * c}" stroke="#1d2433" stroke-width="${r % 10 ? 1.2 : 2.5}"/>`;
  s += `<rect x="0" y="0" width="${c * 10}" height="${c * 10}" fill="none" stroke="#1d2433" stroke-width="2.5"/>`;
  return s + `</svg>`;
}
const COLS = [
  { k: "TD", nl: "tienduizendtallen", es: "decenas de millar", v: 10000, c: "#8a55d6" },
  { k: "D", nl: "duizendtallen", es: "millares", v: 1000, c: "#3b7be0" },
  { k: "H", nl: "honderdtallen", es: "centenas", v: 100, c: "#2f9e63" },
  { k: "T", nl: "tientallen", es: "decenas", v: 10, c: "#e0701a" },
  { k: "E", nl: "eenheden", es: "unidades", v: 1, c: "#d64545" }];
function placeTable(n, editable) {
  const d = String(n).padStart(5, "0").split("").map(Number);
  return `<div class="pt">${COLS.map((c, i) => `<div class="col" style="--c:${c.c}">
    <div class="h" style="color:${c.c}">${c.k}</div><div class="v">${fmt(c.v)}</div>
    <div class="d">${d[i]}</div><div class="dots">${"<i></i>".repeat(d[i])}</div>
    ${editable ? `<div class="pm"><button data-c="${i}" data-d="1">+</button><button data-c="${i}" data-d="-1">−</button></div>` : ""}</div>`).join("")}</div>`;
}
function chipsSplit(n) {
  const d = String(n).padStart(5, "0").split("").map(Number);
  const parts = d.map((x, i) => x ? `<span class="c" style="background:${COLS[i].c}">${fmt(x * COLS[i].v)}</span>` : null).filter(Boolean);
  return `<div class="big">${fmt(n)}</div><div class="chips">= ${parts.join(" + ")}</div>`;
}

/* ============ programa ============ */
const T = (nl, es) => ({ nl, es });
const BLOCKS = [
  { id: "getal", nl: "Getalbegrip", es: "Comprensión de los números", ico: "½", c: "#e0701a", l: "#fff1e4", phase: 1 },
  { id: "bew", nl: "Bewerkingen", es: "Operaciones", ico: "×", c: "#3b7be0", l: "#eaf2ff", phase: 2 },
  { id: "meten", nl: "Metend rekenen", es: "Medidas", ico: "cm", c: "#2f9e63", l: "#e6f6ed", phase: 3 },
  { id: "meet", nl: "Meetkunde", es: "Geometría", ico: "▲", c: "#8a55d6", l: "#f3ecff", phase: 4 }];

const LESSONS = [];
function L(o) { LESSONS.push(o); }

/* ---- Getalbegrip (fase 1, disponible) ---- */
L({ id: "positie", b: "getal", nl: "De positietabel", es: "Números hasta 100 000",
  terms: [T("de positietabel", "la tabla de valor posicional"), T("de eenheden (E)", "las unidades"), T("de tientallen (T)", "las decenas"), T("de honderdtallen (H)", "las centenas"), T("de duizendtallen (D)", "los millares"), T("de tienduizendtallen (TD)", "las decenas de millar")],
  steps: () => [
    { t: "info", q: "Cada columna vale 10 veces más", txt: "En la <i class='nl'>positietabel</i> cada columna vale <b>10 veces</b> la de su derecha.", vis: () => placeTable(42305),
      more: "Lee el 42 305 así: 4 <i class='nl'>tienduizendtallen</i> (40 000), 2 <i class='nl'>duizendtallen</i> (2 000), 3 <i class='nl'>honderdtallen</i> (300), 0 <i class='nl'>tientallen</i> y 5 <i class='nl'>eenheden</i>. El 0 es importante: guarda el sitio de la columna vacía." },
    { t: "build", q: "Construye el número " + fmt(3204), target: 3204, why: "3 D + 2 H + 0 T + 4 E = 3 204. La T queda a 0." },
    { t: "build", q: "Ahora construye " + fmt(40517), target: 40517, why: "4 TD + 0 D + 5 H + 1 T + 7 E." },
    { t: "mcq", q: "¿Cuánto vale el 7 en " + fmt(72015) + "?", opts: [fmt(70000), fmt(7000), "700", "7"], a: fmt(70000), vis: () => placeTable(72015), why: "El 7 está en la columna TD: 7 × 10 000 = 70 000." },
    { t: "mcq", q: "10 <i class='nl'>tientallen</i> son…", opts: ["1 honderdtal", "1 duizendtal", "10 eenheden", "100 eenheden"], a: "1 honderdtal", why: "10 × 10 = 100: diez decenas forman una centena. Por eso al llegar a 10 en una columna «saltas» a la siguiente.",
      more: "Es el mismo mecanismo en todas las columnas: 10 E = 1 T, 10 T = 1 H, 10 H = 1 D, 10 D = 1 TD. Y 10 TD = 100 000, el primer número de 6 cifras." }],
  gen: () => { let n, i, d; do { n = rnd(10000, 99999); i = rnd(0, 4); d = String(n)[i]; } while (d === "0" || String(n).split(d).length !== 2);
    return { t: "num", q: "¿Cuánto vale la cifra " + d + " en " + fmt(n) + "?", vis: () => placeTable(n), a: +d * COLS[i].v, why: "Está en " + COLS[i].k + ": " + d + " × " + fmt(COLS[i].v) + " = " + fmt(+d * COLS[i].v) + "." }; } });

L({ id: "splitsen", b: "getal", nl: "Splitsen", es: "Descomponer números",
  terms: [T("splitsen", "descomponer"), T("samenstellen", "componer"), T("het getal", "el número"), T("het cijfer", "la cifra")],
  steps: () => [
    { t: "info", q: "<i class='nl'>Splitsen</i>: cada cifra, su valor", txt: "Separa el número en el valor de cada columna.", vis: () => chipsSplit(45306),
      more: "Ojo: <i class='nl'>het getal</i> es el número entero (45 306) y <i class='nl'>het cijfer</i> es cada símbolo (4, 5, 3, 0, 6). No hay sumando para la T porque su cifra es 0." },
    { t: "num", q: fmt(28041) + " = 20" + NB + "000 + 8" + NB + "000 + ▢ + 1", a: 40, vis: () => placeTable(28041), why: "La T tiene un 4: vale 40." },
    { t: "num", q: "6 TD + 3 H + 9 E = ▢", a: 60309, why: "60 000 + 300 + 9 = 60 309. Las columnas D y T llevan 0." },

const TOTAL = LESSONS.length;

/* ============ progreso ============ */
const INTERVALS = [1, 3, 7, 14, 30];
function lp(id) { return S.les[id] || null; }
function lessonValue(id) {
  const p = lp(id); if (!p) return 0;
  if (!p.done) return Math.min(.5, (p.step || 0) / (p.n || 6) * .5);
  return Math.min(1, .6 + .1 * (p.box || 0));
}
function lessonState(id) { const p = lp(id); if (!p) return "nuevo"; if (!p.done) return "empezada"; if ((p.box || 0) >= 4) return "dominada"; return "aprendida"; }
const STATE_C = { nuevo: "#e7e3da", empezada: "#f6c99a", aprendida: "#f6a04d", dominada: "#2f9e63" };
function globalPct() { return LESSONS.reduce((s, l) => s + lessonValue(l.id), 0) / TOTAL; }
function blockPct(b) { const ls = LESSONS.filter(l => l.b === b); return ls.reduce((s, l) => s + lessonValue(l.id), 0) / ls.length; }
function dueLessons() { const t = today(); return LESSONS.filter(l => { const p = lp(l.id); return p && p.done && p.due && p.due <= t; }).sort((a, b) => lp(a.id).due.localeCompare(lp(b.id).due)); }
function nextLesson() { return LESSONS.find(l => !l.planned && !(lp(l.id) && lp(l.id).done)); }
function finishLesson(l, errs, n) {
  const p = S.les[l.id] = S.les[l.id] || {};
  p.done = true; p.step = n; p.n = n; p.box = 0; p.errs = errs;
  p.due = addDays(today(), errs > 1 ? 1 : 2); p.doneAt = today(); markDay(); save();
}
function reviewResult(id, ok) {
  const p = S.les[id]; if (!p) return;
  if (ok) { p.box = Math.min(5, (p.box || 0) + 1); p.due = addDays(today(), INTERVALS[Math.min(p.box, 4)]); }
  else { p.box = Math.max(0, (p.box || 0) - 1); p.due = addDays(today(), 1); }
  save();
}
function logError(lessonId, q, given, correct) {
  S.errors.push({ l: lessonId, q: String(q).replace(/<[^>]+>/g, ""), g: String(given), c: String(correct), d: today() });
  if (S.errors.length > 60) S.errors = S.errors.slice(-60); save();
}

/* ============ navegación ============ */
let stack = [];
let current = null;
function go(fn, push = true) { if (push && current) stack.push(current); current = fn; window.scrollTo(0, 0); fn(); }
function back() { if (!stack.length) return false; current = stack.pop(); window.scrollTo(0, 0); current(); return true; }
window.w4Back = () => { if (current === renderHome) return false; if (!back()) { go(renderHome, false); } return true; };
function nav(on) {
  return `<div class="nav">${[["home", "⌂", "Inicio"], ["words", "Aa", "Woordenlijst"], ["tutor", "?", "Tutor"], ["set", "⚙", "Ajustes"]]
    .map(([k, i, t]) => `<button data-nav="${k}" class="${k === on ? "on" : ""}"><b>${i}</b>${t}</button>`).join("")}</div>`;
}
function bindNav() {
  document.querySelectorAll("[data-nav]").forEach(b => b.onclick = () => {
    stack = []; const k = b.dataset.nav;
    go(k === "home" ? renderHome : k === "words" ? renderWords : k === "tutor" ? () => renderTutor(null) : renderSettings, false);
  });
}

function ringSVG(p) {
  const r = 50, c = 2 * Math.PI * r;
  return `<svg viewBox="0 0 118 118" width="118" height="118"><circle cx="59" cy="59" r="${r}" fill="none" stroke="#e7e3da" stroke-width="12"/>
  <circle cx="59" cy="59" r="${r}" fill="none" stroke="#e0701a" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c * p} ${c}" transform="rotate(-90 59 59)"/></svg>`;
}

  const g = globalPct(), done = LESSONS.filter(l => lp(l.id) && lp(l.id).done).length, mast = LESSONS.filter(l => lessonState(l.id) === "dominada").length;
  const due = dueLessons(), nxt = nextLesson();
  const items = Math.min(due.length, 3) * 2;
  let todayTxt = [];
  if (items) todayTxt.push(items + " repasos");
  if (nxt) todayTxt.push("lección nueva: <i>" + esc(nxt.nl) + "</i>");

  $("#app").innerHTML = `

    <div class="map">${LESSONS.map(l => `<div title="${esc(l.nl)}" style="background:${STATE_C[lessonState(l.id)]}"></div>`).join("")}</div>

/* ============ sesión diaria ============ */
function startSession() {
  const due = dueLessons().slice(0, 3);
  if (due.length) {
    const items = []; due.forEach(l => { items.push({ ...l.gen(), _l: l.id }); items.push({ ...l.gen(), _l: l.id }); });
    const ok = {}; due.forEach(l => ok[l.id] = true);
    go(() => runSteps({ title: "Repaso", sub: "<i class='nl'>herhaling</i> · " + due.map(l => l.nl).join(", "), steps: shuffle(items), lessonId: null, review: true,
      onAnswer: (st, good) => { if (!good) ok[st._l] = false; },
      onDone: () => { due.forEach(l => reviewResult(l.id, ok[l.id])); markDay(); const n = nextLesson(); if (n) { stack = []; go(() => runLesson(n), false); } else { stack = []; go(renderHome, false); toast("Repaso terminado"); } } }));
  } else { const n = nextLesson(); if (n) go(() => runLesson(n)); }
}
function runLesson(l) {
  const steps = l.steps();
  runSteps({ title: l.nl, sub: l.es, steps, lessonId: l.id, onStep: i => { const p = S.les[l.id] = S.les[l.id] || {}; if (!p.done) { p.step = Math.max(p.step || 0, i); p.n = steps.length; save(); } },
    onDone: errs => { finishLesson(l, errs, steps.length); stack = []; go(() => renderLessonDone(l, errs), false); } });
}
function renderLessonDone(l, errs) {
  $("#app").innerHTML = `<div class="done"><div class="bigpct">${Math.round(globalPct() * 100)}%</div><div class="mute">del programa completado</div>
  <h2 style="margin:22px 0 6px">✓ <i class="nl">${esc(l.nl)}</i></h2><div class="mute">${errs ? errs + " fallo" + (errs > 1 ? "s" : "") + " · lo repasarás pronto" : "Sin fallos · primer repaso en 2 días"}</div>
  <div class="card" style="text-align:left;margin-top:20px"><b>Palabras nuevas</b>${l.terms.map(t => `<div class="term" style="padding:8px 0;margin:0;background:none"><div class="w"><b>${esc(t.nl)}</b><small>${esc(t.es)}</small></div><button class="spk" data-say="${esc(t.nl)}">🔊</button></div>`).join("")}</div></div>
  <div class="foot"><div><button class="btn" id="home">Volver al inicio</button></div></div>`;
  document.querySelectorAll("[data-say]").forEach(b => b.onclick = () => speak(b.dataset.say.replace(/\(.*?\)/g, "")));
  $("#home").onclick = () => { stack = []; go(renderHome, false); };
}

/* ============ motor de pasos ============ */
function runSteps(cfg) {
  let i = 0, errs = 0;
  const show = () => {
    if (i >= cfg.steps.length) { cfg.onDone(errs); return; }
    cfg.onStep && cfg.onStep(i);
    const ans = (good, st) => { if (!good) errs++; cfg.onAnswer && cfg.onAnswer(st, good); };
    const nxt = () => { i++; window.scrollTo(0, 0); show(); };
    current = () => renderStep(cfg, i, ans, nxt);
    current();
  };
  show();
}
function renderStep(cfg, i, answered, next) {
  const st = cfg.steps[i], n = cfg.steps.length;
  const lessonId = cfg.lessonId || st._l;
  $("#app").innerHTML = `<div class="top"><button class="x" id="close">✕</button><div class="pbar">${cfg.steps.map((_, j) => `<span class="${j <= i ? "on" : ""}"></span>`).join("")}</div></div>
  <div class="mute"><i class="nl">${esc(cfg.title)}</i> · ${cfg.sub}</div>
  <div class="card" style="margin-top:10px"><div class="q">${st.q}</div>${st.txt ? `<div class="txt">${st.txt}</div>` : ""}
  <div class="vis" id="vis">${st.vis ? st.vis() : ""}</div><div id="body"></div><div id="fb"></div>
  ${st.more ? `<button class="morebtn" id="morebtn">Explícamelo más ▾</button><div class="more" id="more" style="display:none">${st.more}</div>` : ""}</div>
  <div class="foot"><div id="foot"></div></div>`;
  $("#close").onclick = () => { if (confirm("¿Salir? Tu avance en esta lección se guarda.")) { stack = []; go(renderHome, false); } };
  if (st.more) $("#morebtn").onclick = () => { const m = $("#more"); m.style.display = m.style.display === "none" ? "block" : "none"; };
  const foot = $("#foot"), body = $("#body");
  let locked = false;
  const showFb = ({ good, given, correctTxt }) => {
    locked = true;
    $("#fb").innerHTML = `<div class="fb ${good ? "ok" : "bad"}"><b>${good ? pick(["✓ Correcto", "✓ ¡Eso es!", "✓ Bien visto"]) : "✗ Era " + esc(correctTxt)}</b>${st.why || ""}</div>`;
    foot.innerHTML = `<button class="btn" id="nx">${i + 1 < n ? "Continuar" : "Terminar"}</button>${good ? "" : `<button class="btn ghost" id="ask">Preguntar al tutor</button>`}`;
    $("#nx").onclick = next;
    if (!good) $("#ask").onclick = () => go(() => renderTutor({ lesson: lessonId, q: st.q, given, correct: correctTxt, why: st.why }));
    $("#fb").scrollIntoView({ behavior: "smooth", block: "nearest" });
  };
  const finish = (good, given, correctTxt) => {
    if (locked) return;
    st._res = { good, given, correctTxt };
    answered(good, st);
    if (!good) logError(lessonId, st.q, given, correctTxt);
    showFb(st._res);
  };
  if (st._res) { showFb(st._res); return; }
  const checkBtn = (label, fn, enabled = true) => { foot.innerHTML = `<button class="btn dark" id="chk" ${enabled ? "" : "disabled"}>${label}</button>`; $("#chk").onclick = fn; };

  if (st.t === "info") { foot.innerHTML = `<button class="btn" id="nx">Entendido</button>`; $("#nx").onclick = next; return; }

  if (st.t === "mcq") {
    const opts = st.opts.length === 3 && st.opts.includes("<") ? st.opts : shuffle(st.opts);
    body.innerHTML = `<div class="opts" style="${opts.length === 3 ? "grid-template-columns:1fr 1fr 1fr" : ""}">${opts.map(o => `<button class="opt" data-o="${esc(o)}">${o}</button>`).join("")}</div>`;
    body.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      if (locked) return; const g = b.dataset.o, ok = g === st.a;
      body.querySelectorAll(".opt").forEach(x => { if (x.dataset.o === st.a) x.classList.add("ok"); });
      if (!ok) b.classList.add("bad");
      finish(ok, g, st.a);
    });
    return;
  }

  if (st.t === "num") {
    body.innerHTML = `<div class="numin"><input id="ni" inputmode="decimal" autocomplete="off" placeholder="Tu respuesta"></div>`;
    const inp = $("#ni");
    const go2 = () => { const v = parseNum(inp.value); if (isNaN(v)) { toast("Escribe un número"); return; } inp.disabled = true; finish(Math.abs(v - st.a) < 1e-9, fmt(v), fmt(st.a)); };
    checkBtn("Comprobar", go2); inp.onkeydown = e => { if (e.key === "Enter") go2(); };
    setTimeout(() => inp.focus(), 50);
    return;
  }

  if (st.t === "build") {
    let val = 0;
    const draw = () => { $("#vis").innerHTML = `<div class="big" style="margin-bottom:10px">${fmt(val)}</div>` + placeTable(val, true);
      $("#vis").querySelectorAll(".pm button").forEach(b => b.onclick = () => { if (locked) return; const c = +b.dataset.c, d = String(val).padStart(5, "0").split("").map(Number);
        d[c] = Math.min(9, Math.max(0, d[c] + +b.dataset.d)); val = +d.join(""); draw(); }); };
    draw();
    checkBtn("Comprobar", () => finish(val === st.target, fmt(val), fmt(st.target)));
    return;
  }

  if (st.t === "line") {
    let v = Math.round((st.min + st.max) / 2 / st.tick) * st.tick + (st.min === 0 ? 0 : 0);
    const snap = st.tick / 2;
    const draw = () => { $("#vis").innerHTML = lineSVG(st.min, st.max, st.tick, { point: v, pointLabel: "?", labelEvery: st.labelEvery || 1, fs: st.fs }) + `<div class="mute">Arrastra el punto naranja</div>`; bind(); };
    const bind = () => { const svg = $("#vis svg"); let drag = false;
      const at = e => { const r = svg.getBoundingClientRect(); const x = (e.clientX - r.left) / r.width * 320; const raw = st.min + (x - 26) / (294 - 26) * (st.max - st.min);
        v = Math.max(st.min, Math.min(st.max, Math.round(raw / snap) * snap)); const c = svg.querySelector("circle"); const X = 26 + (v - st.min) / (st.max - st.min) * 268; c.setAttribute("cx", X); const t = svg.querySelectorAll("text"); t[t.length - 1].setAttribute("x", X); };
      svg.onpointerdown = e => { if (locked) return; drag = true; svg.setPointerCapture(e.pointerId); at(e); };
      svg.onpointermove = e => { if (drag && !locked) at(e); };
      svg.onpointerup = () => drag = false; };
    draw();
    checkBtn("Comprobar", () => { const ok = Math.abs(v - st.target) <= st.tol; $("#vis").innerHTML = lineSVG(st.min, st.max, st.tick, { point: st.target, pointLabel: fmt(st.target), labelEvery: st.labelEvery || 1, fs: st.fs }); finish(ok, "≈ " + fmt(v), fmt(st.target)); });
    return;
  }

  if (st.t === "frac") {
    const on = new Set();
    const draw = () => { $("#vis").innerHTML = barSVG(st.n, 0) + `<div class="big" style="margin-top:8px">${on.size}/${st.n}</div><div class="mute">Toca las partes para colorearlas</div>`;
      $("#vis").querySelectorAll("rect[data-i]").forEach(r => { if (on.has(+r.dataset.i)) r.setAttribute("fill", "#f6a04d"); r.onclick = () => { if (locked) return; const k = +r.dataset.i; on.has(k) ? on.delete(k) : on.add(k); draw(); }; }); };
    draw();
    checkBtn("Comprobar", () => finish(on.size === st.k, on.size + "/" + st.n, st.k + "/" + st.n));
    return;
  }

  if (st.t === "equiv") {
    let m = 1;
    const draw = () => { $("#vis").innerHTML = barSVG(st.n, st.k, { h: 40 }) + `<div class="mute" style="margin:4px 0 10px">${st.k}/${st.n}</div>` + barSVG(st.n * m, st.k * m, { h: 40 }) + `<div class="mute" style="margin-top:4px">misma barra cortada en ${st.n * m} · ${st.k * m}/${st.n * m}</div>`; };
    draw();
    body.innerHTML = `<input type="range" id="rg" min="1" max="3" step="1" value="1"><div class="row mute" style="justify-content:space-between;font-size:12px"><span>${st.n} trozos</span><span>${st.n * 2} trozos</span><span>${st.n * 3} trozos</span></div>
    <div class="opts" style="grid-template-columns:1fr 1fr 1fr">${st.opts.map(o => `<button class="opt" data-o="${o}">${o}</button>`).join("")}</div>`;
    $("#rg").oninput = e => { m = +e.target.value; draw(); };
    body.querySelectorAll(".opt").forEach(b => b.onclick = () => { if (locked) return; const ok = b.dataset.o === st.a; body.querySelectorAll(".opt").forEach(x => { if (x.dataset.o === st.a) x.classList.add("ok"); }); if (!ok) b.classList.add("bad"); finish(ok, b.dataset.o, st.a); });
    return;
  }

  if (st.t === "order") {
    const picked = [];
    const items = shuffle(st.items);
    const draw = () => {
      body.innerHTML = `<div class="slot">${picked.map(v => `<span>${fmt(v)}</span>`).join(" &lt; ") || '<span class="mute" style="background:none">toca los números en orden</span>'}</div>
      <div class="ordr">${items.map(v => `<button data-v="${v}" class="${picked.includes(v) ? "used" : ""}">${fmt(v)}</button>`).join("")}</div>
      ${picked.length ? '<button class="morebtn" id="undo">↶ deshacer</button>' : ""}`;
      body.querySelectorAll(".ordr button").forEach(b => b.onclick = () => { if (locked || picked.includes(+b.dataset.v)) return; picked.push(+b.dataset.v); draw(); });
      $("#undo") && ($("#undo").onclick = () => { if (!locked) { picked.pop(); draw(); } });
      checkBtn("Comprobar", () => { const right = st.items.slice().sort((a, b) => a - b); finish(picked.every((v, j) => v === right[j]), picked.map(fmt).join(" < "), right.map(fmt).join(" < ")); }, picked.length === st.items.length);
    };
    draw();
    return;
  }

  if (st.t === "grid") {
    const rows = new Set();
    const count = () => rows.size * 10;
    const draw = () => { const f = new Set(); rows.forEach(r => { for (let q = 0; q < 10; q++) f.add(r * 10 + q); });
      $("#vis").innerHTML = gridSVG(f) + `<div class="big" style="margin-top:8px">${dec(count() / 100)}</div>`;
      $("#vis").querySelectorAll("rect[data-r]").forEach(r => r.onclick = () => { if (locked) return; const k = +r.dataset.r; rows.has(k) ? rows.delete(k) : rows.add(k); draw(); }); };
    draw();
    checkBtn("Comprobar", () => finish(count() === st.target, dec(count() / 100), dec(st.target / 100)));
    return;
  }
}

/* ============ tutor (Claude) ============ */
const MODEL = "claude-sonnet-5-5";
let tutorCtx = null;
function progressSummary() {
  const done = LESSONS.filter(l => lp(l.id) && lp(l.id).done).map(l => l.nl);
  const errs = S.errors.slice(-8).map(e => `- [${e.l}] ${e.q} → respondió ${e.g}, correcto ${e.c}`).join("\n");
  return `Progreso global: ${Math.round(globalPct() * 100)}% del programa. Lecciones aprendidas: ${done.join(", ") || "ninguna"}.\nErrores recientes:\n${errs || "ninguno"}`;
}
function systemPrompt() {
  const l = tutorCtx && LESSONS.find(x => x.id === tutorCtx.lesson);
  return `Eres el tutor de matemáticas de Tony, un adulto de 46 años, traductor jurídico, bueno en idiomas y que se considera malo en matemáticas. Está aprendiendo el programa de matemáticas del 4º curso de primaria de Flandes (4de leerjaar): Getalbegrip, Bewerkingen, Metend rekenen, Meetkunde.

Cómo enseñas:
- Método socrático: guía con UNA pregunta corta cada vez para que él descubra el error o la idea. No des la solución final salvo que te la pida explícitamente dos veces o diga «dame la respuesta».
- Mensajes breves: 1–3 frases. Solo te extiendes si pide «explícamelo más».
- Habla en español, pero usa el término clave en neerlandés de Flandes en cursiva con *asteriscos* y su traducción la primera vez (p. ej. *teller* (numerador)). Usa la notación belga: coma decimal (3,45) y espacio de millares (45 306).
- Apóyate en imágenes mentales concretas (barras, la tabla de posiciones TD D H T E, la recta numérica, dinero) antes de los símbolos.
- Trátalo como adulto: sin infantilizar, sin elogios exagerados. Si acierta, confirma en pocas palabras y por qué.
- No inventes contenidos de fuera del programa de 4º salvo que pregunte.

${progressSummary()}
${l ? `\nEstá en la lección «${l.nl}» (${l.es}).` : ""}${tutorCtx && tutorCtx.q ? `\nEjercicio en el que falló: «${String(tutorCtx.q).replace(/<[^>]+>/g, "")}». Su respuesta: ${tutorCtx.given}. Correcta: ${tutorCtx.correct}. Empieza preguntándole cómo lo ha pensado o señalando con una pregunta dónde mirar; no reveles la respuesta.` : ""}`;
}
function md(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\*(.+?)\*/g, "<em>$1</em>"); }
function renderTutor(ctx) {
  if (ctx) { tutorCtx = ctx; S.chat = []; save(); }

  ${key ? "" : `<div class="card" style="margin-top:12px"><b>Conecta el tutor</b><div class="mute" style="margin:6px 0">Pega tu clave de API de Anthropic (empieza por <code>sk-ant-</code>). Se guarda solo en este teléfono.</div><input class="field" id="k" placeholder="sk-ant-…"><button class="btn" id="ksave">Guardar</button></div>`}
  <div class="chat" id="chat" style="margin-top:12px"></div>

  <div class="tin"><textarea id="ti" placeholder="Escribe tu duda…"></textarea><button id="send">↑</button></div></div></div>

  const chat = $("#chat");
  const draw = () => { chat.innerHTML = (S.chat.length ? "" : `<div class="msg bot">${tutorCtx && tutorCtx.q ? "Veamos este ejercicio juntos. ¿Cómo lo has pensado?" : "Hola, Tony. Pregúntame lo que quieras del programa; te iré guiando con preguntas."}</div>`) +

        body: JSON.stringify({ model: MODEL, max_tokens: 700, system: systemPrompt(), messages: msgs }) });
      const j = await r.json();

  };

  $("#app").innerHTML = `<h1>Ajustes</h1>
  <div class="card" style="margin-top:14px"><b>Tutor Claude</b><div class="mute" style="margin:6px 0">${k ? "Clave guardada: " + esc(k.slice(0, 10)) + "…" : "Sin clave de API"}</div>
  <input class="field" id="k" placeholder="sk-ant-…"><button class="btn dark" id="ks">Guardar clave</button>${k ? '<button class="btn ghost" id="kd" style="margin-top:8px">Borrar clave</button>' : ""}</div>
  <div class="card"><b>Tu progreso</b><div class="mute" style="margin:6px 0">${Math.round(globalPct() * 100)}% del programa · ${S.errors.length} errores registrados para el tutor</div>
  <button class="btn ghost" id="exp">Copiar copia de seguridad</button><button class="btn ghost" id="imp" style="margin-top:8px">Restaurar copia</button><button class="btn ghost" id="rst" style="margin-top:8px;color:#d64545">Borrar todo el progreso</button></div>
  <div class="mute" style="font-size:12px;margin-top:10px">Wiskunde 4 · fase 1 (<i class="nl">Getalbegrip</i>). Programa: minimumdoelen wiskunde, einde 4de leerjaar (Vlaanderen).</div>
  ${nav("set")}`;
  bindNav();
  $("#ks").onclick = () => { const v = $("#k").value.trim(); if (!v.startsWith("sk-")) { toast("Esa clave no parece válida"); return; } setKey(v); toast("Clave guardada"); renderSettings(); };
  $("#kd") && ($("#kd").onclick = () => { setKey(""); renderSettings(); });
  $("#exp").onclick = async () => { const t = JSON.stringify(S); try { await navigator.clipboard.writeText(t); toast("Copiado al portapapeles"); } catch (e) { prompt("Copia este texto:", t); } };
  $("#imp").onclick = () => { const t = prompt("Pega aquí tu copia:"); if (!t) return; try { const o = JSON.parse(t); if (!o.les) throw 0; S = o; load(); localStorage.setItem(KEY, JSON.stringify(o)); load(); toast("Progreso restaurado"); renderSettings(); } catch (e) { toast("Esa copia no es válida"); } };
  $("#rst").onclick = () => { if (confirm("¿Borrar todo el progreso? No se puede deshacer.")) { localStorage.removeItem(KEY); load(); toast("Progreso borrado"); renderSettings(); } };
}

go(renderHome, false);
</script>
</body>
</html>
